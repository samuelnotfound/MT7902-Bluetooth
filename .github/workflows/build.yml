name: native-macOS-build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MT7902Bt-native-build
          path: |
            out/MT7902Bt.kext
            out/SHA256SUMS
            LICENSE
            NOTICE.md
            LICENSES
          retention-days: 7
